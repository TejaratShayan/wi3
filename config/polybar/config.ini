;; polybar config — managed by ~/setup-i3-environment
;; Colours match the rofi theme (config/rofi/themes/dark.rasi)

[colors]
bg      = #ee1e1e2e
bg-alt  = #313244
fg      = #cdd6f4
fg-dim  = #7f849c
accent  = #89b4fa
urgent  = #f38ba8
green   = #a6e3a1
yellow  = #f9e2af

[bar/main]
monitor = ${env:MONITOR:}
width = ${env:BAR_WIDTH:100%}
offset-x = ${env:BAR_X:0}
height = 28pt
radius = 8
offset-y = 4pt
border-size = 4pt
border-color = #00000000
background = ${colors.bg}
foreground = ${colors.fg}
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.bg-alt}

font-0 = JetBrains Mono:size=10;3
font-1 = FontAwesome:size=10;3

modules-left = launcher i3 xwindow
modules-right = ipcountry vpn fvpn network cpu memory filesystem pulseaudio battery kblayout date screenshot notifications power

cursor-click = pointer
enable-ipc = true
wm-restack = i3
override-redirect = false

[bar/secondary]
inherit = bar/main
modules-left = i3 xwindow
modules-right = date

[module/launcher]
type = custom/text
format = 
format-foreground = ${colors.accent}
format-padding = 1
click-left = rofi -show drun &
click-right = rofi -show window &

[module/i3]
type = internal/i3
pin-workspaces = ${env:PIN_WS:true}
index-sort = true
enable-scroll = false
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.urgent}
label-mode-foreground = ${colors.bg-alt}
label-focused = %index%
label-focused-background = ${colors.accent}
label-focused-foreground = #1e1e2e
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-padding = 1
label-visible = %index%
label-visible-background = ${colors.bg-alt}
label-visible-padding = 1
label-urgent = %index%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = #1e1e2e
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.fg-dim}

[module/ipcountry]
type = custom/script
exec = ~/.local/bin/polybar-ipcountry
tail = true
click-left = kill -USR1 %pid%
click-right = kill -USR2 %pid%

[module/vpn]
; front-end for ~/vless-tun.sh (bin/vpn)
type = custom/script
exec = ~/.local/bin/vpn bar
interval = 2
click-left = ~/.local/bin/vpn toggle &
click-right = ~/.local/bin/vpn menu &

[module/fvpn]
; company VPN (openfortivpn) — bin/fvpn
type = custom/script
exec = ~/.local/bin/fvpn bar
interval = 2
click-left = ~/.local/bin/fvpn toggle &
click-right = ~/.local/bin/fvpn menu &

[module/network]
type = internal/network
interface-type = wired
interval = 3
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.accent}
label-connected = %local_ip%  %downspeed:8%
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = ${colors.urgent}
label-disconnected = offline

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %used%

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 60
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.accent}
label-mounted = %percentage_used%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.accent}
label-volume = %percentage%%
label-muted =  muted
label-muted-foreground = ${colors.fg-dim}

[module/battery]
type = internal/battery
battery = BAT1
adapter = AC1
full-at = 99
poll-interval = 10
format-charging = <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.green}
format-discharging = <ramp-capacity> <label-discharging>
format-full-prefix = " "
format-full-prefix-foreground = ${colors.green}
ramp-capacity-0 = 
ramp-capacity-0-foreground = ${colors.urgent}
ramp-capacity-1 = 
ramp-capacity-1-foreground = ${colors.yellow}
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.accent}

[module/kblayout]
type = custom/script
exec = ~/.local/bin/polybar-kblayout
interval = 1
click-left = fcitx5-remote -t
click-right = fcitx5-configtool &

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
date-alt = %Y-%m-%d
time-alt = %H:%M:%S
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %date%  %time%

[module/screenshot]
type = custom/text
format = 
format-foreground = ${colors.accent}
click-left = ~/.local/bin/screenshot menu &
click-right = ~/.local/bin/screenshot area &

[module/notifications]
type = custom/script
exec = ~/.local/bin/polybar-notifications
interval = 2
click-left = dunstctl set-paused toggle
click-right = ~/.local/bin/rofi-notifications &
click-middle = dunstctl history-clear

[module/power]
type = custom/text
format = 
format-foreground = ${colors.urgent}
format-padding = 1
click-left = rofi-powermenu &

[settings]
screenchange-reload = true
pseudo-transparency = false
