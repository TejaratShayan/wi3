# alacritty config — managed by ~/setup-i3-environment
# Colours match rofi / polybar / dunst (Catppuccin Mocha).

[terminal.shell]
program = "/usr/bin/zsh"

[env]
TERM = "xterm-256color"

[window]
padding = { x = 10, y = 8 }
dynamic_padding = true
decorations = "None"

[font]
normal = { family = "JetBrains Mono", style = "Regular" }
bold = { family = "JetBrains Mono", style = "Bold" }
italic = { family = "JetBrains Mono", style = "Italic" }
size = 10.5

[cursor]
style = { shape = "Block", blinking = "On" }

[selection]
save_to_clipboard = true

[scrolling]
history = 20000

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.selection]
text = "#1e1e2e"
background = "#89b4fa"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"
